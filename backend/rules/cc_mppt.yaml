# MPPT solar charge controller (docs/04 §2.3): power in ~ power out / efficiency.
equipment_kind: charge_controller
controller_type: mppt
defaults: {max_age_s: 20, requires_steady: true}
steady: {role: pv_i, step_pct: 20, settle_s: 5}     # passing clouds change PV current quickly
rules:
  - id: cc_mppt.power_balance
    description: Output power can't exceed input; MPPT efficiency is usually 90-98 %
    inputs: [pv_v, pv_i, battery_v, charge_i]
    when: "pv_i > 0.3"
    check_ratio: {observed: "battery_v * charge_i", expected: "pv_v * pv_i", band: [0.85, 1.0]}

  - id: cc_mppt.pv_above_battery
    description: While charging, PV voltage must be above battery voltage
    inputs: [pv_v, battery_v, charge_i]
    when: "charge_i > 0.3"
    requires_steady: false
    check: "pv_v > battery_v"

  - id: cc_mppt.displayed_power
    description: Displayed PV watts match PV volts times amps (only if PV W is shown)
    inputs: [pv_v, pv_i, pv_w]
    expected: "pv_v * pv_i"
    observed: "pv_w"
    tolerance_pct: 6
