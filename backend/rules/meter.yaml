# Utility meters: electricity (prepaid, postpaid, bidirectional import/export) and water. Few physics partners on one screen, so the
# rules are temporal and band checks. A display self-test (all segments lit, "88888888") is a classic trap.
equipment_kind: meter
defaults: {max_age_s: 60, requires_steady: false}
rules:
  - id: meter.energy_monotonic
    description: The cumulative energy register never goes down
    kind: transition
    inputs: [energy_kwh]
    check: "delta(energy_kwh) >= 0"
    severity_on_persist: critical

  - id: meter.energy_rate
    description: Energy can't grow faster than the meter's maximum current allows (100 A x 250 V = 25 kW)
    kind: transition
    inputs: [energy_kwh]
    check: "delta(energy_kwh) / delta_t <= 25.0 / 3600"

  - id: meter.voltage_band
    description: Single-phase mains, 230 V nominal
    inputs: [voltage_v]
    check: "180 <= voltage_v <= 260"

  - id: meter.frequency_band
    inputs: [frequency_hz]
    check: "49.0 <= frequency_hz <= 51.0"

  - id: meter.export_monotonic
    description: The exported-energy register (2.8.0, solar feed-in) never goes down
    kind: transition
    inputs: [energy_export_kwh]
    check: "delta(energy_export_kwh) >= 0"
    severity_on_persist: critical

  - id: meter.volume_monotonic
    description: The cumulative water volume never goes down
    kind: transition
    inputs: [volume_m3]
    check: "delta(volume_m3) >= 0"
    severity_on_persist: critical

  - id: meter.flow_rate
    description: Volume can't grow faster than the meter's overload flow (Q4 = 1.25 x Q3 2.5 m3/h for a domestic meter)
    kind: transition
    inputs: [volume_m3]
    check: "delta(volume_m3) / delta_t <= 3.125 / 3600"
